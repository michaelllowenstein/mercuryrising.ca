<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img" font-family="Arial, sans-serif">
  <title>FIG. 1 — System architecture</title>
  <desc>Data flow from tenant domain specification through the adapter synthesis engine to four target runtimes.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="580" fill="#fff"/>
  <text x="340" y="22" text-anchor="middle" font-size="12" fill="#555">FIG. 1 — System architecture</text>

  <!-- domain.json -->
  <rect x="220" y="38" width="240" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="340" y="60" text-anchor="middle" font-weight="500" font-size="14" fill="#085041">domain.json</text>
  <text x="340" y="78" text-anchor="middle" font-size="12" fill="#0F6E56">per-tenant · schema-validated</text>

  <!-- validate arrow -->
  <line x1="340" y1="90" x2="340" y2="116" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
  <text x="356" y="108" font-size="11" fill="#555">validate</text>

  <!-- Synthesis Engine -->
  <rect x="190" y="116" width="300" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="340" y="138" text-anchor="middle" font-weight="500" font-size="14" fill="#3C3489">Adapter synthesis engine</text>
  <text x="340" y="156" text-anchor="middle" font-size="12" fill="#534AB7">Python · base64-encodes regex patterns</text>

  <!-- fan arrows to 4 outputs -->
  <path d="M248 168 L248 208 L66 208 L66 244" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <path d="M298 168 L298 208 L196 208 L196 244" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <path d="M388 168 L388 208 L484 208 L484 244" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <path d="M438 168 L438 208 L608 208 L608 244" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <text x="340" y="202" text-anchor="middle" font-size="11" fill="#888">generates</text>

  <!-- 4 adapter boxes -->
  <rect x="20" y="244" width="110" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="75" y="264" text-anchor="middle" font-weight="500" font-size="13" fill="#2C2C2A">nav_maps.zsh</text>
  <text x="75" y="282" text-anchor="middle" font-size="11" fill="#5F5E5A">Zsh arrays</text>

  <rect x="141" y="244" width="110" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="196" y="264" text-anchor="middle" font-weight="500" font-size="13" fill="#2C2C2A">scan_rules.zsh</text>
  <text x="196" y="282" text-anchor="middle" font-size="11" fill="#5F5E5A">b64 patterns</text>

  <rect x="430" y="244" width="108" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
  <text x="484" y="264" text-anchor="middle" font-weight="500" font-size="13" fill="#0C447C">nav+scan.ps1</text>
  <text x="484" y="282" text-anchor="middle" font-size="11" fill="#185FA5">PS hashtables</text>

  <rect x="553" y="244" width="107" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="606" y="264" text-anchor="middle" font-weight="500" font-size="13" fill="#085041">&lt;slug&gt;.ts</text>
  <text x="606" y="282" text-anchor="middle" font-size="11" fill="#0F6E56">TypeScript snapshot</text>

  <!-- Zsh + PS → Shell CLI -->
  <path d="M75 294 L75 354 L228 354 L228 370" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <path d="M196 294 L196 334 L228 334 L228 370" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <path d="M484 294 L484 334 L228 334" fill="none" stroke="#888" stroke-width="0.75" stroke-dasharray="4 3"/>

  <rect x="140" y="370" width="175" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="228" y="392" text-anchor="middle" font-weight="500" font-size="14" fill="#085041">Shell CLI</text>
  <text x="228" y="410" text-anchor="middle" font-size="12" fill="#0F6E56">Zsh · PowerShell · POSIX sh</text>

  <!-- TS snapshot → Portal -->
  <path d="M606 294 L606 350 L350 350 L350 370" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="264" y="370" width="170" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
  <text x="349" y="392" text-anchor="middle" font-weight="500" font-size="14" fill="#0C447C">Angular portal</text>
  <text x="349" y="410" text-anchor="middle" font-size="12" fill="#185FA5">build-time · no HTTP fetch</text>

  <!-- domain.json → API (dashed, runtime) -->
  <path d="M340 90 L340 106 L570 106 L570 156" fill="none" stroke="#888" stroke-width="0.75" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <rect x="492" y="156" width="160" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text x="572" y="178" text-anchor="middle" font-weight="500" font-size="14" fill="#712B13">FastAPI microservice</text>
  <text x="572" y="196" text-anchor="middle" font-size="12" fill="#993C1D">tenant-aware · REST</text>

  <!-- API → JSON responses -->
  <line x1="572" y1="206" x2="572" y2="370" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="492" y="370" width="160" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="572" y="392" text-anchor="middle" font-weight="500" font-size="14" fill="#2C2C2A">JSON API responses</text>
  <text x="572" y="410" text-anchor="middle" font-size="12" fill="#5F5E5A">/api/v1/domain · /scan</text>

  <!-- Portal → API scan call (dashed) -->
  <path d="M434 396 L490 396" fill="none" stroke="#888" stroke-width="0.75" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="462" y="388" text-anchor="middle" font-size="10" fill="#888">scan islands</text>

  <!-- Legend -->
  <line x1="40" y1="486" x2="80" y2="486" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
  <text x="90" y="490" font-size="11" fill="#555">generated artifact</text>
  <line x1="220" y1="486" x2="260" y2="486" stroke="#888" stroke-width="0.75" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="270" y="490" font-size="11" fill="#555">runtime call</text>
  <text x="340" y="516" text-anchor="middle" font-size="11" fill="#888">All artifacts derived from domain.json — never hand-edited</text>
</svg>
