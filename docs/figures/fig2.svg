<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" font-family="Arial, sans-serif">
  <title>FIG. 2 — Tenant isolation model</title>
  <desc>Multiple independent tenant domain specifications validate against a shared JSON Schema. Shared engines below receive tenant context only at their configuration boundary.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fff"/>
  <text x="340" y="22" text-anchor="middle" font-size="12" fill="#555">FIG. 2 — Tenant isolation model</text>

  <!-- Shared JSON Schema -->
  <rect x="140" y="36" width="400" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="340" y="58" text-anchor="middle" font-weight="500" font-size="14" fill="#085041">JSON Schema (Draft-7)</text>
  <text x="340" y="74" text-anchor="middle" font-size="12" fill="#0F6E56">shared · validates all tenants · tenant.schema.json</text>

  <!-- 3 tenant boxes -->
  <line x1="200" y1="84" x2="128" y2="120" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="40" y="120" width="175" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="128" y="142" text-anchor="middle" font-weight="500" font-size="13" fill="#3C3489">MSI domain.json</text>
  <text x="128" y="160" text-anchor="middle" font-size="11" fill="#534AB7">23 ops · 13 rules · 33 statuses</text>

  <line x1="340" y1="84" x2="340" y2="120" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="253" y="120" width="175" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="340" y="142" text-anchor="middle" font-weight="500" font-size="13" fill="#3C3489">Generic domain.json</text>
  <text x="340" y="160" text-anchor="middle" font-size="11" fill="#534AB7">10 ops · 5 rules · 6 statuses</text>

  <line x1="480" y1="84" x2="553" y2="120" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="466" y="120" width="175" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75" stroke-dasharray="6 3"/>
  <text x="553" y="142" text-anchor="middle" font-weight="500" font-size="13" fill="#3C3489">Tenant-N domain.json</text>
  <text x="553" y="160" text-anchor="middle" font-size="11" fill="#534AB7">any domain · any org</text>

  <!-- Separator -->
  <line x1="40" y1="208" x2="640" y2="208" stroke="#bbb" stroke-width="0.5" stroke-dasharray="3 4"/>
  <text x="340" y="200" text-anchor="middle" font-size="10" fill="#aaa">— independent per-tenant data above · shared tenant-agnostic engines below —</text>

  <!-- Convergence lines -->
  <line x1="128" y1="174" x2="128" y2="226" stroke="#bbb" stroke-width="1"/>
  <line x1="340" y1="174" x2="340" y2="226" stroke="#bbb" stroke-width="1"/>
  <line x1="553" y1="174" x2="553" y2="226" stroke="#bbb" stroke-width="1"/>
  <line x1="128" y1="226" x2="553" y2="226" stroke="#bbb" stroke-width="1"/>
  <line x1="340" y1="226" x2="340" y2="248" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Synthesis Engine -->
  <rect x="170" y="248" width="340" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
  <text x="340" y="270" text-anchor="middle" font-weight="500" font-size="14" fill="#633806">Adapter synthesis engine</text>
  <text x="340" y="288" text-anchor="middle" font-size="12" fill="#854F0B">OB_TENANT selects slug at config time only</text>

  <!-- Fan to 3 consumers -->
  <line x1="340" y1="296" x2="340" y2="316" stroke="#888" stroke-width="1"/>
  <path d="M340 316 L128 316 L128 340" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="340" y1="316" x2="340" y2="340" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <path d="M340 316 L553 316 L553 340" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

  <!-- 3 consumers -->
  <rect x="40" y="340" width="175" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="128" y="362" text-anchor="middle" font-weight="500" font-size="13" fill="#2C2C2A">Static analysis engine</text>
  <text x="128" y="378" text-anchor="middle" font-size="11" fill="#5F5E5A">${OB_NAV_SLUG}_SCAN_RULES</text>

  <rect x="253" y="340" width="175" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="340" y="362" text-anchor="middle" font-weight="500" font-size="13" fill="#2C2C2A">FastAPI microservice</text>
  <text x="340" y="378" text-anchor="middle" font-size="11" fill="#5F5E5A">X-Onboarded-Tenant header</text>

  <rect x="466" y="340" width="175" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="553" y="362" text-anchor="middle" font-weight="500" font-size="13" fill="#2C2C2A">Angular portal</text>
  <text x="553" y="378" text-anchor="middle" font-size="11" fill="#5F5E5A">environment.ts build flag</text>

  <text x="340" y="428" text-anchor="middle" font-size="11" fill="#555">Tenant context enters each component once, at its configuration boundary.</text>
  <text x="340" y="446" text-anchor="middle" font-size="11" fill="#555">No tenant-specific logic exists inside any engine or interface component.</text>
  <text x="340" y="476" text-anchor="middle" font-size="11" fill="#aaa">Onboarded v1.2.0 — tenant isolation enforced at the data layer</text>
</svg>
