<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" font-family="Arial, sans-serif">
  <title>FIG. 3 — Adapter synthesis flow</title>
  <desc>Input domain.json flows through schema validation, base64 encoding of scan rule patterns, and emission of five output adapter files.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="540" fill="#fff"/>
  <text x="340" y="22" text-anchor="middle" font-size="12" fill="#555">FIG. 3 — Adapter synthesis flow</text>

  <!-- Input -->
  <rect x="200" y="36" width="280" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="340" y="58" text-anchor="middle" font-weight="500" font-size="14" fill="#085041">Input: domain.json</text>
  <text x="340" y="74" text-anchor="middle" font-size="12" fill="#0F6E56">tenants/&lt;slug&gt;/domain/domain.json</text>
  <line x1="340" y1="84" x2="340" y2="108" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Schema validation -->
  <rect x="200" y="108" width="280" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="340" y="130" text-anchor="middle" font-weight="500" font-size="14" fill="#3C3489">JSON Schema validation</text>
  <text x="340" y="148" text-anchor="middle" font-size="12" fill="#534AB7">validate_domain.py · exits 1 on error</text>

  <!-- Fail branch -->
  <path d="M480 132 L560 132 L560 92 L554 92" fill="none" stroke="#A32D2D" stroke-width="0.75" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="570" y="112" font-size="11" fill="#A32D2D">FAIL → exit 1</text>

  <line x1="340" y1="156" x2="340" y2="180" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- For each scan rule -->
  <rect x="160" y="180" width="360" height="80" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
  <text x="340" y="204" text-anchor="middle" font-weight="500" font-size="14" fill="#633806">For each scan_rule in domain.json</text>
  <text x="255" y="228" text-anchor="middle" font-size="11" fill="#854F0B">pattern: "Password\s*=\s*"</text>
  <text x="370" y="228" text-anchor="middle" font-size="13" fill="#854F0B">→</text>
  <text x="455" y="228" text-anchor="middle" font-size="11" fill="#854F0B">base64.b64encode()</text>
  <text x="340" y="250" text-anchor="middle" font-size="11" fill="#854F0B">"UGFzc3dvcmRccyo9XHMqIg==" — pipe-safe, ASCII-safe</text>

  <line x1="340" y1="260" x2="340" y2="284" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Emit -->
  <rect x="200" y="284" width="280" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="340" y="306" text-anchor="middle" font-weight="500" font-size="14" fill="#2C2C2A">Emit output files</text>
  <text x="340" y="324" text-anchor="middle" font-size="12" fill="#5F5E5A">generate_adapters.py --all</text>

  <!-- Fan to 5 files -->
  <line x1="340" y1="332" x2="340" y2="354" stroke="#888" stroke-width="1"/>
  <line x1="60"  y1="354" x2="620" y2="354" stroke="#888" stroke-width="1"/>
  <line x1="60"  y1="354" x2="60"  y2="376" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="178" y1="354" x2="178" y2="376" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="340" y1="354" x2="340" y2="376" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="492" y1="354" x2="492" y2="376" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="620" y1="354" x2="620" y2="376" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

  <!-- 5 output boxes -->
  <rect x="18"  y="376" width="84" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="60"  y="398" text-anchor="middle" font-weight="500" font-size="12" fill="#2C2C2A">nav_maps</text>
  <text x="60"  y="414" text-anchor="middle" font-weight="500" font-size="12" fill="#2C2C2A">.zsh</text>
  <text x="60"  y="428" text-anchor="middle" font-size="10" fill="#5F5E5A">Zsh arrays</text>

  <rect x="136" y="376" width="84" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="178" y="398" text-anchor="middle" font-weight="500" font-size="12" fill="#2C2C2A">scan_rules</text>
  <text x="178" y="414" text-anchor="middle" font-weight="500" font-size="12" fill="#2C2C2A">.zsh</text>
  <text x="178" y="428" text-anchor="middle" font-size="10" fill="#5F5E5A">b64 patterns</text>

  <rect x="298" y="376" width="84" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
  <text x="340" y="398" text-anchor="middle" font-weight="500" font-size="12" fill="#0C447C">nav_maps</text>
  <text x="340" y="414" text-anchor="middle" font-weight="500" font-size="12" fill="#0C447C">.ps1</text>
  <text x="340" y="428" text-anchor="middle" font-size="10" fill="#185FA5">PS hashtables</text>

  <rect x="450" y="376" width="84" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
  <text x="492" y="398" text-anchor="middle" font-weight="500" font-size="12" fill="#0C447C">scan_rules</text>
  <text x="492" y="414" text-anchor="middle" font-weight="500" font-size="12" fill="#0C447C">.ps1</text>
  <text x="492" y="428" text-anchor="middle" font-size="10" fill="#185FA5">b64 patterns</text>

  <rect x="578" y="376" width="84" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="620" y="398" text-anchor="middle" font-weight="500" font-size="12" fill="#085041">&lt;slug&gt;.ts</text>
  <text x="620" y="414" text-anchor="middle" font-size="11" fill="#085041">TypeScript</text>
  <text x="620" y="428" text-anchor="middle" font-size="10" fill="#0F6E56">plain pattern</text>

  <!-- Annotations -->
  <text x="119" y="452" text-anchor="middle" font-size="10" fill="#888">Shell: b64-encoded</text>
  <text x="416" y="452" text-anchor="middle" font-size="10" fill="#888">Shell: b64-encoded</text>
  <text x="620" y="452" text-anchor="middle" font-size="10" fill="#888">TS: decoded string</text>

  <text x="60"  y="470" text-anchor="middle" font-size="10" fill="#555">Zsh CLI</text>
  <text x="178" y="470" text-anchor="middle" font-size="10" fill="#555">Zsh scan</text>
  <text x="340" y="470" text-anchor="middle" font-size="10" fill="#555">PS module</text>
  <text x="492" y="470" text-anchor="middle" font-size="10" fill="#555">PS scan</text>
  <text x="620" y="470" text-anchor="middle" font-size="10" fill="#555">Portal</text>

  <text x="340" y="510" text-anchor="middle" font-size="11" fill="#aaa">All five files regenerated from domain.json on every CI merge — never hand-edited</text>
</svg>
